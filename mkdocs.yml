site_name: authkeys
site_description: Pluggable AuthorizedKeysCommand provider for OpenSSH — file/HTTP/LDAP key sources, TTL caching, and an optional key server.
site_url: https://jose-pr.github.io/authkeys/
repo_url: https://github.com/jose-pr/authkeys
repo_name: jose-pr/authkeys
edit_uri: edit/main/docs/

# Constrain the scan to docs/ so pymdownx.snippets + strict nav don't trip on
# repo-level markdown.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Guide:
      - Configuration: guide/configuration.md
      - Key sources: guide/sources.md
      - HTTP key server: guide/server.md
      - CLI commands: guide/cli.md
  - API Reference:
      - Overview: api/reference.md
      - authkeys: api/authkeys.md
      - Sources: api/sources.md
      - Server: api/server.md
      - Cache: api/cache.md
      - Config: api/config.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
