[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authkeys"
version = "0.1.1"
authors = [{ name = "Jose A." }]
description = "Pluggable AuthorizedKeysCommand provider for OpenSSH (file/HTTP/LDAP sources, TTL cache, optional key server)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ssh", "openssh", "authorized_keys", "ldap", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = ["duho"]

[project.optional-dependencies]
http = ["requests"]
ldap = ["ldap3", "cryptography"]
all = ["requests", "ldap3", "cryptography"]
dev = ["build", "hatchling", "pytest", "pytest-cov", "twine", "requests"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
authkeys = "authkeys.cli:run"

[project.urls]
Homepage = "https://github.com/jose-pr/authkeys/"
Issues = "https://github.com/jose-pr/authkeys/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
reportPrivateImportUsage = false
reportUnusedExpression = false
