[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authkeys"
version = "0.5.0"
authors = [{ name = "Jose A." }]
description = "Pluggable AuthorizedKeysCommand provider for OpenSSH (file/HTTP/LDAP sources, TTL cache, optional key server)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ssh", "openssh", "authorized_keys", "ldap", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "anycfg>=0.15.0,<0.16",
    "duho>=0.7.4,<0.8.0",
    "netimps>=0.4.0,<0.5",
    "sslcontext>=2.1.0,<3",
]

[project.optional-dependencies]
http = ["syshttp>=0.1.0,<0.2"]
# ldap3 2.10.2rc4 adds session_security (signed/sealed Kerberos binds); python-ldap
# is used instead when installed. cryptography 40.0 has every certificate API used.
ldap = ["ldap3>=2.10.2rc4,<2.11", "cryptography>=40.0.0,<51"]
# Kerberos for the ldap3 client (python-ldap uses the system's Cyrus SASL instead).
# gssapi builds against the system's krb5 where no wheel exists, so it is not in all.
kerberos = [
    "gssapi>=1.7,<2; sys_platform != 'win32'",
    "winkerberos>=0.12,<0.14; sys_platform == 'win32'",
]
all = ["authkeys[http,ldap]"]
dev = ["black", "build", "hatchling", "pytest", "pytest-cov", "pytest-timeout", "pyyaml", "twine"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
authkeys = "authkeys.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/authkeys/"
Documentation = "https://jose-pr.github.io/authkeys/"
Issues = "https://github.com/jose-pr/authkeys/issues"


# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/authkeys/AGENTS.md is included automatically by living in the package
# dir; the repo-root AGENTS.md is development-only and deliberately not
# shipped.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "authkeys/README.md"

[tool.hatch.build.targets.sdist]
exclude = ["/.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Hard per-test timeout: the suite runs in seconds, so a test exceeding this is
# hung (e.g. a socket/thread test wedged on a CI runner). Fail it with a
# traceback instead of hanging the whole CI job. `thread` method works on
# Windows runners (signal-based alarms do not).
timeout = 60
timeout_method = "thread"

[tool.black]
# The floor Python: black must not emit syntax 3.9 cannot parse.
target-version = ["py39"]

[tool.pyright]
reportPrivateImportUsage = false
reportUnusedExpression = false
