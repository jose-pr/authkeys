# Example authkeys configuration.
#
# Copy to one of the system paths (/etc/authkeys.conf,
# /etc/authkeys/authkeys.conf, /etc/ssh/authkeys.conf) or pass with --config.

[globals]
# Optional. Fully-qualified callables loaded at startup.
# usermap      = mypkg.usermaps.some_map
# groupmembers = mypkg.groupmembers.some_resolver

[cache]
# Backend classes: authkeys.cache.AuthKeysCacheMemBackend (default, per-process)
#                  authkeys.cache.AuthKeysCacheFileBackend (shared, on disk)
backend = authkeys.cache.AuthKeysCacheMemBackend
expire = 3600
# TTL for a cached "this user has no keys" (negative) result. Defaults to expire;
# a shorter value lets a newly-added key appear sooner.
# negative_expire = 60
# For the file backend, list one or more existing directories; the first that
# exists is used. Entries are written atomically with 0600 perms (0700 dir):
# backend = authkeys.cache.AuthKeysCacheFileBackend
# path = /var/cache/authkeys
# Optional eviction bounds for the file backend (enforced by `authkeys cache purge`):
# max_age = 604800
# max_entries = 10000
# On source ERRORS (exception / non-2xx HTTP), serve stale (expired) cached keys
# instead of nothing. A merely-empty result is NOT an error and won't fall back:
expired_on_error = 1

# --- Sources -------------------------------------------------------------
# A source section is [source:<name>]. `enabled` and `cached` default to true.

[source:files]
backend = authkeys.sources.authorizedkeys
# Relative to each user's ~/.ssh/
paths =
    authorized_keys
    authorized_keys2
# Optional per-source cache TTL, overriding [cache] expire (0 = don't cache):
# expire = 0

[source:http]
enabled = 0
backend = authkeys.sources.http
# {username} is substituted per lookup
address = https://keys.example.com/{username}
# Optional mutual TLS: client cert,key
# credentials = /etc/pki/tls/certs/client.crt,/etc/pki/tls/private/client.key
# TLS verification: true/false to toggle, or a path to a CA bundle.
# verify = /etc/pki/tls/certs/ca-bundle.crt

[source:github]
enabled = 0
backend = authkeys.sources.github
# {username} is substituted per lookup. Defaults to the GitHub .keys endpoint;
# point at another forge with the same convention (e.g. GitLab) by overriding:
# url = https://gitlab.com/{username}.keys
# url = https://github.com/{username}.keys
# Optional request timeout in seconds:
# timeout = 10

[source:ldap]
enabled = 0
backend = authkeys.sources.ldap
server = ldaps://ldap.example.com:636
basedn = o=Example,c=US
username_attr = uid
cert_attr = userCertificate
# Server-certificate verification (this channel decides who logs in!):
#   unset / system  -> verify against the OS trust store  (default, secure)
#   a file path      -> verify against that CA bundle
#   a directory path -> verify against that CA directory
#   none             -> DO NOT verify (insecure; only for testing)
# tls_verify = system
# tls_cert/tls_key are the CLIENT mutual-TLS credentials (not server verification):
# tls_cert = /etc/pki/tls/certs/client.crt
# tls_key = /etc/pki/tls/private/client.key
# Connection/receive timeout in seconds (bounds a hung LDAP server):
# timeout = 10
# Optional filter callable (username, cert) -> bool | str
# cert_filter = authkeys.sources.ldap.only_auth_keys

# --- Unattended HTTP key server (authkeys serve) -------------------------
[serve]
bind = 127.0.0.1
port = 8090
path = /keys
# API key required in the ?apikey= query parameter. Keep it out of the file
# on disk by pulling it from the environment. NOTE: if this line is present but
# resolves empty (e.g. the env var is unset), `authkeys serve` refuses to start
# rather than silently running without authentication. Remove the line entirely
# to intentionally run unauthenticated (bind to a trusted interface only).
api_key = ${env:AUTHKEYS_APIKEY}
# Max number of ?username= params accepted per request (bounds the work one
# request can force; matters most in the auth-disabled mode):
# max_usernames = 16
