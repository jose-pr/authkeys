# Example authkeys configuration.
#
# Copy to one of the system paths (/etc/authkeys.conf,
# /etc/authkeys/authkeys.conf, /etc/ssh/authkeys.conf) or pass with --config.

[globals]
# Optional. Fully-qualified callables loaded at startup.
# usermap      = mypkg.usermaps.some_map
# groupmembers = mypkg.groupmembers.some_resolver

[cache]
# Backend classes: authkeys.cache.AuthKeysCacheMemBackend (default, per-process)
#                  authkeys.cache.AuthKeysCacheFileBackend (shared, on disk)
backend = authkeys.cache.AuthKeysCacheMemBackend
expire = 3600
# For the file backend, list one or more existing directories; the first that
# exists is used:
# backend = authkeys.cache.AuthKeysCacheFileBackend
# path = /var/cache/authkeys
# On source errors, serve stale (expired) cached keys instead of nothing:
expired_on_error = 1

# --- Sources -------------------------------------------------------------
# A source section is [source:<name>]. `enabled` and `cached` default to true.

[source:files]
backend = authkeys.sources.authorizedkeys
# Relative to each user's ~/.ssh/
paths =
    authorized_keys
    authorized_keys2

[source:http]
enabled = 0
backend = authkeys.sources.http
# {username} is substituted per lookup
address = https://keys.example.com/{username}
# Optional mutual TLS: client cert,key
# credentials = /etc/pki/tls/certs/client.crt,/etc/pki/tls/private/client.key
# TLS verification: true/false to toggle, or a path to a CA bundle.
# verify = /etc/pki/tls/certs/ca-bundle.crt

[source:ldap]
enabled = 0
backend = authkeys.sources.ldap
server = ldaps://ldap.example.com:636
basedn = o=Example,c=US
username_attr = uid
cert_attr = userCertificate
tls_cert = /etc/pki/tls/certs/server.crt
tls_key = /etc/pki/tls/private/server.key
# Optional filter callable (username, cert) -> bool | str
# cert_filter = authkeys.sources.ldap.only_auth_keys

# --- Unattended HTTP key server (authkeys serve) -------------------------
[serve]
bind = 127.0.0.1
port = 8090
path = /keys
# API key required in the ?apikey= query parameter. Keep it out of the file
# on disk by pulling it from the environment. NOTE: if this line is present but
# resolves empty (e.g. the env var is unset), `authkeys serve` refuses to start
# rather than silently running without authentication. Remove the line entirely
# to intentionally run unauthenticated (bind to a trusted interface only).
api_key = ${env:AUTHKEYS_APIKEY}
