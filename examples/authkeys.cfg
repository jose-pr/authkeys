# Example authkeys configuration (TOML).
#
# Install as /etc/authkeys.cfg, or name another file with --config or
# AUTHKEYS_CONFIG. ${env.NAME} is replaced from the environment. A key authkeys
# does not know, or a value of the wrong type, is logged as a WARNING and ignored.

[globals]
# Optional. Dotted paths of callables loaded at startup.
# usermap = "mypkg.usermaps.some_map"
# groupmembers = "mypkg.groupmembers.some_resolver"

[cache]
# "memory" (default, per process) or "file" (shared, on disk).
backend = "memory"
expire = 3600
# TTL for a cached "this user has no keys" result. Defaults to expire; a shorter
# value lets a newly added key appear sooner.
# negative_expire = 60
# For the file backend, one or more directories; the first that exists is used.
# It must be owned by, and writable only by, the account that runs authkeys.
# Entries are written atomically, 0600 (0700 directories):
# backend = "file"
# path = "/var/cache/authkeys"
# On source ERRORS (an exception, a non-2xx HTTP reply, a refused LDAP search)
# serve the last cached keys even when expired. An empty result is not an error:
expired_on_error = true
# ...but not entries more than this many seconds past their TTL (unset: no limit):
# max_stale = 86400

# --- Sources -------------------------------------------------------------
# One [source.<name>] table per source. `backend` names the kind of source;
# `enabled` and `cached` default to true, `expire` overrides [cache] expire.

[source.files]
backend = "file"
# Relative to each user's ~/.ssh/
paths = ["authorized_keys", "authorized_keys2"]
# expire = 0   # 0 = don't cache this source

[source.http]
enabled = false
backend = "http"
# {username} is substituted (percent-encoded) per lookup
url = "https://keys.example.com/{username}"
# Optional mutual TLS: client certificate and key
# certificate = "/etc/pki/tls/certs/client.crt"
# key = "/etc/pki/tls/private/client.key"
# TLS verification: true/false, or the path of a CA bundle (default: the OS store)
# verify = "/etc/pki/tls/certs/ca-bundle.crt"
# Proxy: unset follows the system's configuration; "direct" or a proxy URL
# proxy = "direct"
# A bearer token read from this variable (keeps it out of the URL and the file)
# token_env = "KEYSERVER_TOKEN"
# Seconds per wait, seconds for the whole request, and retries (logins wait on these)
# timeout = 10
# deadline = 15
# retries = 0

[source.github]
enabled = false
backend = "github"
# Defaults to GitHub's .keys endpoint; another forge with the same convention:
# url = "https://gitlab.com/{username}.keys"
# timeout = 10
# With the default identity usermap, local user X trusts the forge account X:
# set [globals] usermap before enabling this source.

[source.ldap]
enabled = false
backend = "ldap"
# ldaps://host, a bare host (LDAPS), or ldap:// with Kerberos or starttls
server = "ldaps://ldap.example.com:636"
basedn = "o=Example,c=US"
username_attr = "uid"            # Active Directory: "sAMAccountName"
cert_attr = "userCertificate"
# client = "auto"                # python-ldap when installed, else ldap3
# Authentication: "gssapi" (default: the host's machine keytab), "simple",
# "external" (client certificate) or "anonymous"
auth = "anonymous"
# keytab = "/etc/krb5.keytab"    # gssapi
# bind_dn = "cn=reader,o=Example,c=US"   # simple, with the password in:
# password_env = "LDAP_READER_PASSWORD"
# starttls = false               # ldap:// with StartTLS
# Server-certificate verification (this channel decides who logs in!):
#   unset / "system" -> the platform trust store (default)
#   a file path       -> that CA bundle
#   a directory path  -> that CA directory
#   "none"            -> NO verification (insecure; testing only)
# tls_verify = "system"
# tls_cert/tls_key: the CLIENT certificate (for auth = "external"):
# tls_cert = "/etc/pki/tls/certs/client.crt"
# tls_key = "/etc/pki/tls/private/client.key"
# timeout = 10
# The default filter keeps only valid, CA-issued certificates whose KeyUsage/EKU
# allow client authentication; "none" keeps every certificate in the attribute.
# cert_filter = "authkeys.sources.only_auth_keys"
# Keep only certificates issued by this CA:
# issuer_ca = "/etc/pki/tls/certs/user-ca.pem"

# --- Unattended HTTP key server (authkeys serve) -------------------------
# Every option here can also be given on the command line or as
# AUTHKEYS_SERVE_<OPTION> (command line > variable > this file).
[serve]
# Where to listen: host:port, [v6]:port, :port (all IPv4), comma-separated
listen = "127.0.0.1:8090"
path = "/keys"
# Serve HTTPS (strongly advised off loopback):
# certificate = "/etc/authkeys/tls.pem"
# key = "/etc/authkeys/tls.key"
# The API key, required as ?apikey= or "Authorization: Bearer <key>". Keep it out
# of this file by reading it from the environment. If this line is present but
# resolves empty (the variable is unset), `authkeys serve` refuses to start rather
# than running without authentication. Remove the line to run unauthenticated
# (and listen on a trusted interface only).
api_key = "${env.AUTHKEYS_APIKEY}"
# Most username parameters one request may carry:
# max_usernames = 16
# Seconds a connection may stay idle, and requests served at once (more get 503):
# request_timeout = 10
# max_connections = 64
